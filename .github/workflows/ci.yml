name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      # ruff comes from uv.lock, the same build every dev venv and the pre-commit hook run.
      - name: Install the locked dev environment
        run: uv sync --locked --extra dev

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # python_version = "3.9" makes mypy parse installed dependencies with 3.9 syntax; on
      # 3.10+ the locked huggingface_hub / numpy sources use newer syntax and the run stops early.
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.9"

      - name: Install the locked dev and serve environment
        run: uv sync --locked --extra dev --extra serve

      - name: Mypy
        run: uv run mypy src/ --no-incremental

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python admits and the classifiers list.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      # No [whisperx] extra: that pulls torch, and the suite fakes Whisper, ffmpeg
      # and Ollama anyway. Tests needing an absent package importorskip themselves.
      - name: Install the locked dev and serve environment
        run: uv sync --locked --extra dev --extra serve

      - name: Run tests
        run: uv run pytest
