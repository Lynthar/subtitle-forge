name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Same minor as .pre-commit-config.yaml; the rule set itself lives in pyproject.toml.
      - name: Install ruff
        run: pip install "ruff>=0.16,<0.17"

      - name: Ruff check
        run: ruff check

      - name: Ruff format check
        run: ruff format --check

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python admits and the classifiers list.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No [whisperx] extra: that pulls torch, and the suite fakes Whisper, ffmpeg
      # and Ollama anyway. Tests needing an absent package importorskip themselves.
      - name: Install the project with the dev and serve extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"

      - name: Run tests
        run: pytest
