[build-system]
# >=77 for SPDX `license` expression + `license-files` support
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-forge"
version = "0.1.0"
description = "Local video subtitle generation and translation CLI tool"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["subtitle", "whisper", "translation", "cli", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "faster-whisper>=1.0.0",
    "ollama>=0.3.0",
    "ffmpeg-python>=0.2.0",
    "pysrt>=1.1.2",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    # pytest 9 needs Python 3.10; the 3.9 floor still gets 8.x. mypy 2 rejects
    # python_version = "3.9", and ruff's rule set shifts between minors.
    "pytest>=8,<10",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.8,<2",
]
whisperx = [
    "whisperx>=3.1.0",
]
serve = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # server/models.py uses Pydantic v2 API (field_validator); FastAPI's own
    # range still admits v1, so pin the major here.
    "pydantic>=2.0",
]

[project.scripts]
subtitle-forge = "subtitle_forge.cli.app:cli"

[project.urls]
Repository = "https://github.com/Lynthar/subtitle-forge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# The gate is this explicit set, not ruff's default set: that one grows with each
# release and by now flags the typing.List / Optional spelling the py39 floor requires.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
